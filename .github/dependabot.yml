# Dependabot configuration.
#
# This repo is bun-managed: Lovable builds from bun.lock, which is the source of
# truth. package-lock.json was removed (it drifted and misled `npm ci`), so we
# track the bun ecosystem here instead of npm.
#
# NOTE: as of 2025-02 Dependabot supports the bun package manager for VERSION
# updates (text-based bun.lock, bun >= 1.1.39) but does NOT yet support bun
# SECURITY updates. So scheduled version updates below keep bun.lock current;
# GitHub Dependabot *alerts* still surface vulnerabilities for manual action
# until bun security updates ship.
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # No `groups:` block, deliberately. ADR-APP-005 §3 requires dependency bumps
    # to arrive as individual PRs: a grouped bump hides which package changed
    # what, and the #70 group silently moved a build-toolchain package, passed
    # `tsc`, and broke `main`'s boot. One PR per package is what makes the boot
    # gate meaningful — you cannot boot-gate a bundle and learn anything about
    # the member that broke it. Grouping was reintroduced here after that ADR
    # and kept regenerating banned PRs (#108 most recently), which is why this
    # comment exists rather than an empty section someone can helpfully fill in.
